# Builds the desktop app's installers on each OS (jpackage can only package for the OS it runs
# on), checks that every native library loads with --self-test, and keeps the installers as
# downloadable artifacts. Pushing a desktop-v* tag (e.g. desktop-v0.3.0) also publishes them
# as a GitHub Release.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: ":desktop-app:packageMsi :desktop-app:createDistributable"
            selftest: desktop-app/build/compose/binaries/main/app/PhotoDuel/PhotoDuel.exe
            artifacts: desktop-app/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            tasks: ":desktop-app:packageDeb :desktop-app:createDistributable"
            selftest: desktop-app/build/compose/binaries/main/app/PhotoDuel/bin/PhotoDuel
            artifacts: desktop-app/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop-app/build.gradle.kts)
          [ "$want" = "$have" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $have"; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # Ubuntu ships the HEIC (HEVC) decoder as a separate plugin package.
      - name: Install libheif (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libheif1 libheif-plugin-libde265
      - name: Build
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} :desktop-app:test
      - name: Self-test the packaged app
        shell: bash
        run: |
          export PHOTODUEL_DATADIR="$RUNNER_TEMP/photoduel"
          "${{ matrix.selftest }}" --self-test || status=$?
          cat "$PHOTODUEL_DATADIR/logs/app.log"
          exit ${status:-0}
      - uses: actions/upload-artifact@v5
        with:
          name: photoduel-${{ runner.os }}
          path: ${{ matrix.artifacts }}

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Photo Duel $version for desktop" \
            --notes "Photo Duel $version for Windows and Linux.

          **Windows:** download the .msi and run it. It isn't signed yet, so Windows SmartScreen will warn; choose *More info*, then *Run anyway*.

          **Linux (Debian/Ubuntu):** \`sudo apt install ./photoduel_*.deb libheif1 libheif-plugin-libde265\`. The libheif packages are needed to open HEIC photos."
